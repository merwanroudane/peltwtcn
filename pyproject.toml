[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peltwtcn"
version = "1.0.1"
description = "Hybrid deep-learning carbon price forecasting with PELT structural-break detection and wavelet denoising"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords = [
    "carbon price",
    "EU ETS",
    "structural breaks",
    "PELT",
    "wavelet denoising",
    "LSTM",
    "GRU",
    "temporal convolutional network",
    "forecasting",
    "energy economics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.4",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "PyWavelets>=1.3",
    "ruptures>=1.1.7",
    "scikit-learn>=1.1",
    "statsmodels>=0.13",
    "requests>=2.25",
    "tabulate>=0.9",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.12"]
data = ["yfinance>=0.2.28", "openpyxl>=3.1"]
plots = ["seaborn>=0.12"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = ["sphinx>=6.0", "furo"]
all = [
    "tensorflow>=2.12",
    "yfinance>=0.2.28",
    "openpyxl>=3.1",
    "seaborn>=0.12",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/merwanroudane/peltwtcn"
"Step-by-step guide" = "https://github.com/merwanroudane/peltwtcn/blob/main/docs/STEP_BY_STEP_GUIDE.md"
"Tutorial (runnable)" = "https://github.com/merwanroudane/peltwtcn/blob/main/examples/tutorial_step_by_step.py"
"Syntax reference" = "https://github.com/merwanroudane/peltwtcn/blob/main/docs/SYNTAX.md"
"Replication notes" = "https://github.com/merwanroudane/peltwtcn/blob/main/docs/REPLICATION_NOTES.md"
Documentation = "https://github.com/merwanroudane/peltwtcn/tree/main/docs"
Repository = "https://github.com/merwanroudane/peltwtcn"
Issues = "https://github.com/merwanroudane/peltwtcn/issues"
Changelog = "https://github.com/merwanroudane/peltwtcn/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["peltwtcn"]
include-package-data = true

[tool.setuptools.package-data]
peltwtcn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "slow: tests that fit a neural network (deselect with '-m \"not slow\"')",
    "network: tests that download data (deselect with '-m \"not network\"')",
]
